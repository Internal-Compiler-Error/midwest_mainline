[package]
name = "downloader-gui"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
downloader = { path = "../../downloader" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rand = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
