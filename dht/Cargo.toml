[package]
name = "midwest_mainline"
version = "0.2.0-beta"
edition = "2024"
license = "MIT"
description = "A BitTorrent DHT implementation in async Rust"
readme = "README.md"
authors = ["Liang Wang"]
repository = "https://github.com/Internal-Compiler-Error/midwest_mainline"
documentation = "https://docs.rs/crate/midwest_mainline/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num = { version = "0.4.3" }
bendy = { version = "0.6.1" }
juicy_bencode = "0.1.3"
rand = { version = "0.10.2" }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-stream = "0.1.19"
futures = "0.3.34"
tracing = "0.1.44"
crc32c = "0.6.8"
hex = "0.4.3"
sha3 = "0.12.0"
thiserror = "2.0.20"
smallvec = { version = "1.15.1", features = ["const_new"] }
base64 = "0.23.1"
eyre = "0.6.14"
diesel = { version = "2.3.13", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2" ] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
zerocopy = { version = "0.8.48", features = ["derive"] }

[dev-dependencies]
color-eyre = "0.6.5"
serde_json = "1.0.151"
console-subscriber = "0.5.0"
tracing-subscriber = "0.3.23"
